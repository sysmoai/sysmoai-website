kind = "web"
previewPath = "/admin/"
title = "SYSmoAI Admin"
version = "1.0.0"
id = "artifacts/sysmoai-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 25074

[services.development]
run = "pnpm --filter @workspace/sysmoai-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sysmoai-admin", "run", "build" ]
publicDir = "artifacts/sysmoai-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25074"
BASE_PATH = "/admin/"
