kind = "web"
previewPath = "/"
title = "SYSmoAI Website"
version = "1.0.0"
id = "artifacts/sysmoai-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20255

[services.development]
run = "pnpm --filter @workspace/sysmoai-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sysmoai-website", "run", "build" ]
run = "pnpm --filter @workspace/sysmoai-website run serve"

[services.env]
PORT = "20255"
BASE_PATH = "/"
