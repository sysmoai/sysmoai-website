<svg width="180" height="180" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dot-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2f6e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0B0F" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Background: dark rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#bg-grad)"/>
  <rect width="100" height="100" rx="20" fill="none" stroke="#2563EB" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Back hexagon: dark navy, blue stroke -->
  <path d="M50 17 L78 33 L78 59 L50 75 L22 59 L22 33 Z"
    fill="#0D1B52" fill-opacity="0.95"
    stroke="#2563EB" stroke-opacity="0.75" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Front hexagon: solid bright blue, positioned lower for 3D depth -->
  <path d="M50 43 L69 54 L69 75 L50 86 L31 75 L31 54 Z"
    fill="#2563EB" fill-opacity="0.95"
    stroke="#60A5FA" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner highlight on front hexagon -->
  <path d="M50 43 L69 54 L50 65 L31 54 Z"
    fill="#3B82F6" fill-opacity="0.4"/>

  <!-- Glowing dot — top-right corner accent -->
  <circle cx="82" cy="17" r="4.5" fill="#60A5FA" filter="url(#dot-glow)"/>
  <circle cx="82" cy="17" r="2.5" fill="#BFDBFE"/>
</svg>
