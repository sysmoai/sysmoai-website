<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark navy, rounded square for favicon readability on all browser tabs -->
  <rect width="180" height="180" rx="40" fill="#0A0B0F"/>
  <!-- Subtle inner glow -->
  <rect width="180" height="180" rx="40" fill="url(#bg-glow)"/>
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="58%" r="52%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A0B0F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- SYSmoAI® Icon Mark v2.0 — 3 concentric hexagonal layers, viewBox 0 0 100 100 mapped to 180x180 -->
  <!-- Layer 1 — Infrastructure, outer -->
  <path
    d="M45 61.2 L90 43.2 L135 61.2 L135 97.2 L90 115.2 L45 97.2 Z"
    fill="#1E3A8A" fill-opacity="0.30"
    stroke="#2563EB" stroke-opacity="0.75"
    stroke-width="3.8" stroke-linejoin="round"/>
  <!-- Layer 2 — Orchestration, mid -->
  <path
    d="M54 88.2 L90 72 L126 88.2 L126 115.2 L90 131.4 L54 115.2 Z"
    fill="#2563EB" fill-opacity="0.55"
    stroke="#3B82F6" stroke-opacity="0.90"
    stroke-width="3.8" stroke-linejoin="round"/>
  <!-- Layer 3 — Intelligence, core -->
  <path
    d="M72 109.8 L90 100.8 L108 109.8 L108 127.8 L90 136.8 L72 127.8 Z"
    fill="#3B82F6" fill-opacity="1.00"
    stroke="#60A5FA" stroke-opacity="1.00"
    stroke-width="3.8" stroke-linejoin="round"/>
  <!-- Core glow -->
  <path
    d="M72 109.8 L90 100.8 L108 109.8 L108 127.8 L90 136.8 L72 127.8 Z"
    fill="#60A5FA" fill-opacity="0.18"
    stroke="none"/>
</svg>
