  <!-- Dark mode init: apply before paint to prevent flash -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('sysmoai-theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.classList.add(theme);
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Splash screen styles — inlined for zero-latency paint -->
  <style>
    #sysmoai-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0A0B0F;
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sysmoai-splash.fade-out {
      opacity: 0;
    }
    .splash-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(37,99,235,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .splash-logo-wrap {
      position: relative;
      z-index: 1;
      animation: splash-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes splash-pop {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    .splash-ring {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1.5px solid rgba(37,99,235,0.35);
      animation: splash-spin 2.8s linear infinite;
    }
    .splash-ring::after {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #3B82F6;
      border-radius: 50%;
      box-shadow: 0 0 10px 3px rgba(59,130,246,0.7);
    }
    @keyframes splash-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .splash-wordmark {
      margin-top: 20px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #F1F5F9;
      z-index: 1;
      animation: splash-fade-up 0.55s 0.15s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .splash-wordmark span { color: #2563EB; }
    .splash-tagline {
      margin-top: 6px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(148,163,184,0.7);
      z-index: 1;
      animation: splash-fade-up 0.55s 0.25s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .splash-bar-track {
      margin-top: 36px;
      width: 100px;
      height: 2px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
      z-index: 1;
      animation: splash-fade-up 0.55s 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .splash-bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #2563EB, #60A5FA);
      border-radius: 99px;
      transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes splash-fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Instant splash screen — shows before any JS loads -->
  <div id="sysmoai-splash" role="status" aria-label="Loading SYSmoAI">
    <div class="splash-glow"></div>
    <div class="splash-logo-wrap">
      <div class="splash-ring"></div>
      <!-- SYSmoAI official logo mark -->
      <svg width="88" height="88" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;filter:drop-shadow(0 0 22px rgba(37,99,235,0.55))">
        <defs>
          <filter id="sdot" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <radialGradient id="sbg" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#1a2f6e" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#0A0B0F" stop-opacity="1"/>
          </radialGradient>
        </defs>
        <!-- Dark rounded-square background -->
        <rect width="100" height="100" rx="20" fill="url(#sbg)"/>
        <rect width="100" height="100" rx="20" fill="none" stroke="#2563EB" stroke-opacity="0.18" stroke-width="1.5"/>
        <!-- Back hexagon: dark navy with blue border -->
        <path d="M50 17 L78 33 L78 59 L50 75 L22 59 L22 33 Z"
          fill="#0D1B52" fill-opacity="0.95"
          stroke="#2563EB" stroke-opacity="0.75" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- Front hexagon: solid bright blue, lower for 3D depth -->
        <path d="M50 43 L69 54 L69 75 L50 86 L31 75 L31 54 Z"
          fill="#2563EB" fill-opacity="0.95"
          stroke="#60A5FA" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
        <!-- Inner highlight on front hex -->
        <path d="M50 43 L69 54 L50 65 L31 54 Z" fill="#3B82F6" fill-opacity="0.4"/>
        <!-- Glowing dot — top-right corner accent -->
        <circle cx="82" cy="17" r="4.5" fill="#60A5FA" filter="url(#sdot)"/>
        <circle cx="82" cy="17" r="2.5" fill="#BFDBFE"/>
      </svg>
    </div>
    <div class="splash-wordmark">SYS<span>mo</span>AI</div>
    <div class="splash-tagline">AI Systems · Bangladesh</div>
    <div class="splash-bar-track">
      <div class="splash-bar-fill" id="splash-bar-fill"></div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // Start loading bar immediately
    requestAnimationFrame(function() {
      setTimeout(function() {
        var bar = document.getElementById('splash-bar-fill');
        if (bar) bar.style.width = '100%';
      }, 60);
    });

    // Dismiss splash on 'sysmoai-ready' event OR after max 2.2s
    function dismissSplash() {
      var el = document.getElementById('sysmoai-splash');
      if (!el || el._dismissed) return;
      el._dismissed = true;
      el.classList.add('fade-out');
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 480);
    }
    window.addEventListener('sysmoai-ready', dismissSplash);
    setTimeout(dismissSplash, 2200);
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
