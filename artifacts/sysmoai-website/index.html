<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYSmoAI | Practical AI Systems & Automation in Bangladesh</title>
  <meta name="description" content="SYSmoAI is a Bangladesh-based AI systems and automation practice focused on practical workflows and scoped implementation." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://sysmoai.com/" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="theme-color" content="#0A0B0F" />

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('sysmoai-theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.classList.add(theme);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <style>
    #sysmoai-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0A0B0F;
      color: #F8FAFC;
      pointer-events: none;
      transition: opacity 0.25s ease;
      font-family: Inter, system-ui, sans-serif;
    }
    #sysmoai-splash.fade-out { opacity: 0; }
    .splash-mark { width: 54px; height: 54px; }
    .splash-name { font-weight: 700; letter-spacing: -0.02em; }
    .splash-sub { font-size: 11px; color: #64748B; letter-spacing: 0.14em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="sysmoai-splash" role="status" aria-label="Loading SYSmoAI">
    <svg class="splash-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M25 34 L50 24 L75 34 L75 54 L50 64 L25 54 Z" fill="#1E3A8A" fill-opacity="0.30" stroke="#2563EB" stroke-opacity="0.60" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M30 49 L50 40 L70 49 L70 64 L50 73 L30 64 Z" fill="#2563EB" fill-opacity="0.50" stroke="#3B82F6" stroke-opacity="0.80" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M40 61 L50 56 L60 61 L60 71 L50 76 L40 71 Z" fill="#3B82F6" stroke="#60A5FA" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
    <div class="splash-name">SYSmoAI</div>
    <div class="splash-sub">Systems in Motion</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    function dismissSplash() {
      var el = document.getElementById('sysmoai-splash');
      if (!el || el.dataset.dismissed === 'true') return;
      el.dataset.dismissed = 'true';
      el.classList.add('fade-out');
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    }
    window.addEventListener('sysmoai-ready', dismissSplash);
    setTimeout(dismissSplash, 1800);
  </script>
</body>
</html>
