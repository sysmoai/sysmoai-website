  <!-- Dark mode init: apply before paint to prevent flash -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('sysmoai-theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.classList.add(theme);
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Splash screen styles — inlined for zero-latency paint -->
  <style>
    #sysmoai-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0A0B0F;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sysmoai-splash.fade-out { opacity: 0; }
    .splash-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(37,99,235,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .splash-logo-wrap {
      position: relative;
      z-index: 1;
      animation: splash-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes splash-pop {
      from { opacity: 0; transform: scale(0.72); }
      to   { opacity: 1; transform: scale(1); }
    }
    /* Breathing pulse on the logo */
    .splash-mark {
      display: block;
      filter: drop-shadow(0 0 20px rgba(37,99,235,0.5));
      animation: splash-breathe 2s ease-in-out infinite;
    }
    @keyframes splash-breathe {
      0%,100% { filter: drop-shadow(0 0 16px rgba(37,99,235,0.45)); }
      50%      { filter: drop-shadow(0 0 32px rgba(59,130,246,0.75)); }
    }
    /* Orbit ring around the logo */
    .splash-ring {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1.5px solid rgba(37,99,235,0.30);
      animation: splash-spin 3s linear infinite;
    }
    .splash-ring::after {
      content: '';
      position: absolute;
      top: -3.5px;
      left: 50%;
      margin-left: -3.5px;
      width: 7px;
      height: 7px;
      background: #3B82F6;
      border-radius: 50%;
      box-shadow: 0 0 12px 4px rgba(59,130,246,0.65);
    }
    @keyframes splash-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    /* Wordmark — uses Inter, "mo" at 65% opacity per official brand spec */
    .splash-wordmark {
      margin-top: 22px;
      font-family: 'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif;
      font-size: 26px;
      letter-spacing: -0.02em;
      color: #F1F5F9;
      z-index: 1;
      display: flex;
      align-items: baseline;
      animation: splash-fade-up 0.5s 0.12s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .splash-wordmark .w-sys { font-weight: 700; letter-spacing: -0.02em; }
    .splash-wordmark .w-mo  { font-weight: 400; letter-spacing: -0.04em; opacity: 0.65; }
    .splash-wordmark .w-ai  { font-weight: 700; letter-spacing: 0.02em; }
    .splash-tagline {
      margin-top: 6px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: rgba(148,163,184,0.6);
      z-index: 1;
      animation: splash-fade-up 0.5s 0.22s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .splash-bar-track {
      margin-top: 38px;
      width: 88px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
      z-index: 1;
      animation: splash-fade-up 0.5s 0.28s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .splash-bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #2563EB, #60A5FA);
      border-radius: 99px;
      transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes splash-fade-up {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Instant splash screen — shows before any JS loads -->
  <div id="sysmoai-splash" role="status" aria-label="Loading SYSmoAI">
    <div class="splash-glow"></div>
    <div class="splash-logo-wrap">
      <div class="splash-ring"></div>
      <!-- SYSmoAI® Official Icon Mark v2.0 — 3 concentric hexagonal layers -->
      <svg class="splash-mark" width="92" height="92" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Layer 1 — outer, infrastructure foundation, navy/blue -->
        <path d="M25 34 L50 24 L75 34 L75 54 L50 64 L25 54 Z"
          fill="#1E3A8A" fill-opacity="0.30"
          stroke="#2563EB" stroke-opacity="0.60"
          stroke-width="2.5" stroke-linejoin="round"/>
        <!-- Layer 2 — mid, system orchestration, blue -->
        <path d="M30 49 L50 40 L70 49 L70 64 L50 73 L30 64 Z"
          fill="#2563EB" fill-opacity="0.50"
          stroke="#3B82F6" stroke-opacity="0.80"
          stroke-width="2.5" stroke-linejoin="round"/>
        <!-- Layer 3 — core, AI intelligence engine, bright blue solid -->
        <path d="M40 61 L50 56 L60 61 L60 71 L50 76 L40 71 Z"
          fill="#3B82F6" fill-opacity="1.00"
          stroke="#60A5FA" stroke-opacity="1.00"
          stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <!-- Wordmark: SYS(700) mo(400,65%) AI(700) — official brand spec -->
    <div class="splash-wordmark">
      <span class="w-sys">SYS</span><span class="w-mo">mo</span><span class="w-ai">AI</span>
    </div>
    <div class="splash-tagline">Systems in Motion</div>
    <div class="splash-bar-track">
      <div class="splash-bar-fill" id="splash-bar-fill"></div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // Start loading bar immediately
    requestAnimationFrame(function() {
      setTimeout(function() {
        var bar = document.getElementById('splash-bar-fill');
        if (bar) bar.style.width = '100%';
      }, 60);
    });

    // Dismiss splash on 'sysmoai-ready' event OR after max 2.2s
    function dismissSplash() {
      var el = document.getElementById('sysmoai-splash');
      if (!el || el._dismissed) return;
      el._dismissed = true;
      el.classList.add('fade-out');
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 480);
    }
    window.addEventListener('sysmoai-ready', dismissSplash);
    setTimeout(dismissSplash, 2200);
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
