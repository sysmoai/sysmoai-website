          minLength: 1
          maxLength: 50
        nextStartDate:
          type: string
          maxLength: 50
          nullable: true

    WaitlistSignupList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WaitlistSignup"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ScheduledPostPlatform:
      type: string
      enum:
