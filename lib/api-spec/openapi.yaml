        - x_thread
        - instagram_feed
        - instagram_story
        - tiktok_reel
        - newsletter

    ScheduledPostStatus:
      type: string
      enum: [queued, posted, skipped, failed]

    ScheduledPostFunnel:
      type: string
      enum: [TOF, MOF, MOF_BOF, BOF]

    ScheduledPost:
      type: object
      required:
        - id
        - sequenceNo
        - fileRef
        - platform
        - pillar
        - hookPattern
        - funnel
        - ctaCode
        - title
        - content
        - scheduledFor
        - status
        - impressions
        - clicks
        - waitlistSignups
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        sequenceNo:
          type: integer
          description: 1..76 — order in the master calendar
        fileRef:
          type: string
          description: Source ref e.g. "L1", "X1", "Thread W1"
        platform:
          $ref: "#/components/schemas/ScheduledPostPlatform"
        pillar:
          type: string
        hookPattern:
          type: string
        funnel:
          $ref: "#/components/schemas/ScheduledPostFunnel"
        ctaCode:
          type: string
          description: '"A" = free-AI-audit, "W" = WhatsApp'
        title:
          type: string
        hookLine:
          type: string
          nullable: true
        content:
          type: string
        assetUrl:
          type: string
          nullable: true
        scheduledFor:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ScheduledPostStatus"
        postedAt:
          type: string
          format: date-time
          nullable: true
        postUrl:
          type: string
          nullable: true
        impressions:
          type: integer
        clicks:
          type: integer
        waitlistSignups:
          type: integer
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScheduledPostList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledPost"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ScheduledPostUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ScheduledPostStatus"
        scheduledFor:
          type: string
          format: date-time
        postedAt:
          type: string
          format: date-time
          nullable: true
        postUrl:
          type: string
          maxLength: 500
          nullable: true
        assetUrl:
          type: string
          maxLength: 500
          nullable: true
        impressions:
          type: integer
          minimum: 0
        clicks:
          type: integer
          minimum: 0
        waitlistSignups:
          type: integer
          minimum: 0
        notes:
          type: string
          maxLength: 5000
          nullable: true

    ScheduledPostsSeedResult:
      type: object
      required: [imported, updated, total]
      properties:
        imported:
          type: integer
        updated:
          type: integer
        total:
          type: integer

    PlatformCount:
      type: object
      required: [platform, queued, posted, skipped, failed, total]
      properties:
        platform:
          $ref: "#/components/schemas/ScheduledPostPlatform"
        queued:
          type: integer
        posted:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        total:
          type: integer

    WeekCount:
      type: object
      required: [weekStart, queued, posted, total]
      properties:
        weekStart:
          type: string
          format: date
          description: BDT week start (Monday)
        queued:
          type: integer
        posted:
          type: integer
        total:
          type: integer

    ScheduledPostsSummary:
      type: object
      required:
        - totals
        - byPlatform
        - byWeek
        - upcoming
        - performance
      properties:
        totals:
          type: object
          required: [total, queued, posted, skipped, failed]
          properties:
            total:
