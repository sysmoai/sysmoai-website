openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SYSmoAI API — public lead capture + admin dashboard
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public lead-capture endpoints (no auth, rate-limited)
  - name: admin
    description: Admin dashboard endpoints (auth required)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contact:
    post:
      operationId: createContactSubmission
      tags: [public]
      summary: Submit a contact-form message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSubmissionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /audit-requests:
    post:
      operationId: createAuditRequest
      tags: [public]
      summary: Submit a free-AI-audit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /waitlist:
    post:
      operationId: createWaitlistSignup
      tags: [public]
      summary: Sign up for the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistSignupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Current admin profile (also confirms allowlist)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Counts across all resources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/contact-submissions:
    get:
      operationId: listContactSubmissions
      tags: [admin]
      summary: List contact submissions
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/StatusParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/contact-submissions/export.csv:
    get:
      operationId: exportContactSubmissions
      tags: [admin]
      summary: Export contact submissions as CSV
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/contact-submissions/{id}:
    get:
      operationId: getContactSubmission
      tags: [admin]
      summary: Fetch one contact submission
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateContactSubmission
      tags: [admin]
      summary: Update contact submission status / note
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/audit-requests:
    get:
      operationId: listAuditRequests
      tags: [admin]
      summary: List audit requests
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/StatusParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRequestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit-requests/export.csv:
    get:
      operationId: exportAuditRequests
      tags: [admin]
      summary: Export audit requests as CSV
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit-requests/{id}:
    get:
      operationId: getAuditRequest
      tags: [admin]
      summary: Fetch one audit request
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAuditRequest
      tags: [admin]
      summary: Update audit request status / note
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/waitlist-signups:
    get:
      operationId: listWaitlistSignups
      tags: [admin]
      summary: List waitlist signups
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/StatusParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/waitlist-signups/export.csv:
    get:
      operationId: exportWaitlistSignups
      tags: [admin]
      summary: Export waitlist signups as CSV
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/waitlist-signups/{id}:
    get:
      operationId: getWaitlistSignup
      tags: [admin]
      summary: Fetch one waitlist signup
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWaitlistSignup
      tags: [admin]
      summary: Update waitlist signup status / note
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistSignup"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    StatusParam:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SubmissionStatus"
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Signed in but not on the admin allowlist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true

    SubmissionAck:
      type: object
      required: [id, ok]
      properties:
        id:
          type: integer
        ok:
          type: boolean

    SubmissionStatus:
      type: string
      enum: [new, contacted, archived]

    SubmissionUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        internalNote:
          type: string
          nullable: true

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    AdminMe:
      type: object
      required: [userId, email, isAdmin]
      properties:
        userId:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean

    AdminSummary:
      type: object
      required:
        - contactSubmissions
        - auditRequests
        - waitlistSignups
      properties:
        contactSubmissions:
          $ref: "#/components/schemas/ResourceCounts"
        auditRequests:
          $ref: "#/components/schemas/ResourceCounts"
        waitlistSignups:
          $ref: "#/components/schemas/ResourceCounts"

    ResourceCounts:
      type: object
      required: [total, new, contacted, archived]
      properties:
        total:
          type: integer
        new:
          type: integer
        contacted:
          type: integer
        archived:
          type: integer

    ContactSubmissionInput:
      type: object
      required: [name, contact, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        contact:
          type: string
          minLength: 5
          maxLength: 200
        message:
          type: string
          minLength: 10
          maxLength: 5000
        service:
          type: string
          maxLength: 100
          nullable: true

    ContactSubmission:
      type: object
      required: [id, name, contact, message, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        contact:
          type: string
        message:
          type: string
        service:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        internalNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ContactSubmissionList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactSubmission"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AuditRequestInput:
      type: object
      required: [name, email, biggestChallenge]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 200
        whatsapp:
          type: string
          maxLength: 50
          nullable: true
        company:
          type: string
          maxLength: 200
          nullable: true
        biggestChallenge:
          type: string
          minLength: 10
          maxLength: 5000

    AuditRequest:
      type: object
      required: [id, name, email, biggestChallenge, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        biggestChallenge:
          type: string
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        internalNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuditRequestList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRequest"
        pagination:
          $ref: "#/components/schemas/Pagination"

    WaitlistSignupInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 200
        name:
          type: string
          maxLength: 200
          nullable: true
        source:
          type: string
          maxLength: 100
          nullable: true

    WaitlistSignup:
      type: object
      required: [id, email, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        internalNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    WaitlistSignupList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WaitlistSignup"
        pagination:
          $ref: "#/components/schemas/Pagination"
