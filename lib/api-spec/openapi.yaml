            queued:
              type: integer
            posted:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
        byPlatform:
          type: array
          items:
            $ref: "#/components/schemas/PlatformCount"
        byWeek:
          type: array
          items:
            $ref: "#/components/schemas/WeekCount"
        upcoming:
          type: array
          description: Next 5 queued posts ordered by scheduledFor ASC
