<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SYSmoAI Admin Theme Audit - Infographic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  #container { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="container"></div>
<script src="https://unpkg.com/@antv/infographic@latest/dist/infographic.min.js"></script>
<script>
  const syntax = `infographic list-grid-badge-card
data
  title SYSmoAI Admin Theme Audit
  desc Adding light mode support and a UI polish sweep to the founder console
  lists
    - label Theme system
      desc New ThemeContext: ?theme URL override, localStorage, toggles light/dark on <html>
      icon settings
    - label Light CSS variables
      desc Full :root.light token set with white cards, soft gradient body, balanced shadows
      icon sun
    - label Clerk sign-in
      desc Appearance refactored to buildClerkAppearance(isDark), memoized with useMemo
      icon shield check
    - label Theme toggle button
      desc Sun/Moon icon added to AdminShell header next to page actions
      icon switch
    - label Token sweep
      desc Status badges, ErrorBoundary, not-found page now use semantic tokens or dual variants
      icon brush
    - label Quality gate
      desc Workspace typecheck passes, zero console errors, screenshots verified in both themes
      icon check circle
theme
  palette #1E3A8A #60A5FA #0EA5E9 #10B981 #F59E0B #EF4444`;

  const infographic = new AntVInfographic.Infographic({
    container: '#container',
    width: '100%',
    height: '100%',
  });

  const render = () => infographic.render(syntax);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(render).catch(render);
  } else {
    render();
  }
</script>
</body>
</html>
